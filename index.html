<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Screen Embedded Page</title>
    <style>
        /* Basic reset */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* Style for the iframe to cover the entire screen */
        iframe {
            border: none;
            width: 100vw; /* 100% of the viewport width */
            height: 100vh; /* 100% of the viewport height */
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <!-- The iframe that embeds the external webpage -->
    <iframe src="https://plays.org/game/nuts-and-bolts-screw-puzzle/"></iframe>
</body>
</html>
